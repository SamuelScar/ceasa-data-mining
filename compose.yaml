x-python-service: &python-service
  build:
    context: .
    args:
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
  image: ceasa-data-mining:local
  working_dir: /workspace
  volumes:
    - .:/workspace
  init: true

services:
  workspace:
    <<: *python-service
    ports:
      - "127.0.0.1:8888:8888"
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --ServerApp.root_dir=/workspace
    stdin_open: true
    tty: true

  preprocessamento:
    <<: *python-service
    profiles:
      - tarefas
    environment:
      CEASA_DATA_LIMITE_INFERENCIA: ${CEASA_DATA_LIMITE_INFERENCIA:-}
    command:
      - python
      - preprocessamento/tratar_ceasa.py
      - data/cotacoes.sqlite
      - --output-db
      - data/cotacoes_preprocessadas.sqlite
      - --overwrite
