x-python-service: &python-service
  build:
    context: .
    args:
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
  image: ceasa-data-mining:local
  working_dir: /workspace
  volumes:
    - .:/workspace
  init: true

services:
  workspace:
    <<: *python-service
    ports:
      - "127.0.0.1:8888:8888"
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --ServerApp.root_dir=/workspace
    stdin_open: true
    tty: true

  preprocessamento:
    <<: *python-service
    profiles:
      - tarefas
    environment:
      CEASA_DATA_LIMITE_INFERENCIA: ${CEASA_DATA_LIMITE_INFERENCIA:-2025-10-31}
    command:
      - python
      - preprocessamento/tratar_ceasa.py
      - data/cotacoes.sqlite
      - --output-db
      - resultados/preprocessamento/cotacoes_preprocessadas.sqlite
      - --overwrite

  granger:
    <<: *python-service
    profiles:
      - tarefas
    environment:
      GRANGER_DATA_INICIO: ${GRANGER_DATA_INICIO:-2022-01-04}
      GRANGER_DATA_CORTE_TREINO: ${GRANGER_DATA_CORTE_TREINO:-2025-10-31}
      GRANGER_DATA_FIM_TESTE: ${GRANGER_DATA_FIM_TESTE:-2026-10-31}
      GRANGER_MIN_DIAS_COMUNS: ${GRANGER_MIN_DIAS_COMUNS:-400}
      GRANGER_FFILL_LIMITE: ${GRANGER_FFILL_LIMITE:-3}
      GRANGER_MAX_LAG: ${GRANGER_MAX_LAG:-10}
      GRANGER_ALPHA: ${GRANGER_ALPHA:-0.05}
    command:
      - python
      - granger/executar_granger.py
      - resultados/preprocessamento/cotacoes_preprocessadas.sqlite
      - --output-db
      - resultados/granger/granger.sqlite
      - --overwrite

  efeito-domino:
    <<: *python-service
    profiles:
      - tarefas
    environment:
      DOMINO_ALTA_MINIMA: ${DOMINO_ALTA_MINIMA:-0.05}
      DOMINO_PERCENTIL: ${DOMINO_PERCENTIL:-0.90}
      DOMINO_JANELA_DIAS: ${DOMINO_JANELA_DIAS:-5}
    command:
      - python
      - efeitos/domino/executar_efeito_domino.py
      - resultados/granger/granger.sqlite
      - --output-db
      - resultados/efeitos/domino/efeito_domino.sqlite
      - --overwrite

  pipeline-completo:
    <<: *python-service
    profiles:
      - tarefas
    environment:
      CEASA_DATA_LIMITE_INFERENCIA: ${CEASA_DATA_LIMITE_INFERENCIA:-2025-10-31}
      GRANGER_DATA_INICIO: ${GRANGER_DATA_INICIO:-2022-01-04}
      GRANGER_DATA_CORTE_TREINO: ${GRANGER_DATA_CORTE_TREINO:-2025-10-31}
      GRANGER_DATA_FIM_TESTE: ${GRANGER_DATA_FIM_TESTE:-2026-10-31}
      GRANGER_MIN_DIAS_COMUNS: ${GRANGER_MIN_DIAS_COMUNS:-400}
      GRANGER_FFILL_LIMITE: ${GRANGER_FFILL_LIMITE:-3}
      GRANGER_MAX_LAG: ${GRANGER_MAX_LAG:-10}
      GRANGER_ALPHA: ${GRANGER_ALPHA:-0.05}
      DOMINO_ALTA_MINIMA: ${DOMINO_ALTA_MINIMA:-0.05}
      DOMINO_PERCENTIL: ${DOMINO_PERCENTIL:-0.90}
      DOMINO_JANELA_DIAS: ${DOMINO_JANELA_DIAS:-5}
    command:
      - python
      - pipeline/executar_pipeline.py
